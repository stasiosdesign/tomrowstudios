<svg xmlns="http://www.w3.org/2000/svg" width="22" height="27" viewBox="0 0 22 27">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="edgeBlur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.85" result="edgeInk"/>
      <feComposite in="edgeInk" in2="edgeBlur" operator="in" result="edge"/>
      <feOffset in="SourceAlpha" dy="1" result="dropOffset"/>
      <feGaussianBlur in="dropOffset" stdDeviation="1" result="dropBlur"/>
