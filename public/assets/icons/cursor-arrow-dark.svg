      <feMerge><feMergeNode in="drop"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path transform="translate(3 3)" filter="url(#shadow)" fill="#0a0a0a" d="M0 1.1Q0 0 0.84 0.71L13.82 11.64Q15.2 12.8 13.4 12.8L7.1 12.8Q5.9 12.8 5.14 13.73L1.14 18.61Q0 20 0 18.2Z"/>
