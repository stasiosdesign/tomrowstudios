# A new release of the shared CMS, taken at once: the package's release
# workflow sends a `cms-release` event with the version (or run it by hand
# from the Actions tab, which also redeploys the Studio from staging when
# the version is already installed). It installs that version on main and
# runs the Studio's checks, merges main into staging and checks again, then
# deploys the hosted Studio (the appId in studio/sanity.cli.ts) from staging,
# and only then pushes both branches, so they say what is deployed.
#
# The hosted Studio is always staging's Studio on the latest release: a
# deploy by hand (`npm run studio:deploy`) is held to the same rule by
# studio/scripts/check-deploy.mjs, so neither way undoes the other. Only
# studio/ changes; the site itself is the same (vercel.ts skips the build).
#
# Needs the SANITY_AUTH_TOKEN secret: a Sanity token for this project with
# permission to deploy Studios (sanity.io/manage → API → Tokens, "Deploy
# Studio"). Without it, nothing is deployed and the run fails saying so.
name: Studio update
on:
  repository_dispatch:
    types: [cms-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'CMS version to install (e.g. 1.3.0); empty for the latest'
        required: false
permissions:
  contents: write
  packages: read
concurrency: studio-update
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@stasiosdesign'
      - name: The deploy token is set
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: test -n "$SANITY_AUTH_TOKEN" || { echo "::error::Set the SANITY_AUTH_TOKEN secret (see this file's top comment)"; exit 1; }
      - name: Install the release on main
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.version || 'latest' }}
        # The site's own packages too: the Studio's checks read the root tsconfig
        run: |
          npm ci
          cd studio
          npm ci
          npm install --save-exact "@stasiosdesign/sanity-cms@$VERSION"
          npm run check
          version=$(node -p "require('@stasiosdesign/sanity-cms/package.json').version")
          echo "CMS_VERSION=$version" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package.json package-lock.json; then
            echo "main already pins $version"
          else
            git commit -m "Studio: the shared CMS $version (deployed)" -- package.json package-lock.json
          fi
      - name: Merge main into staging
        run: |
          git switch staging
          git merge --no-edit main
          npm ci
          cd studio
          npm ci
          npm run check
          node -p "'staging runs @stasiosdesign/sanity-cms ' + require('@stasiosdesign/sanity-cms/package.json').version"
      - name: Deploy the Studio from staging
        working-directory: studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy --yes
      - name: Push main and staging
        run: git push origin main staging
